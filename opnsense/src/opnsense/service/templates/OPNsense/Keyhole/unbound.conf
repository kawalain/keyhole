{% if not helpers.empty('OPNsense.Keyhole.general.enabled') and not helpers.empty('OPNsense.Keyhole.general.upstream') %}
# keyhole: Unbound forwards every query to keyhole (ADR 0004), which relays
# it to the configured upstream. Generated by the keyhole plugin.
server:
  do-not-query-localhost: no

forward-zone:
  name: "."
  forward-addr: 127.0.0.1@5353
{% endif %}
