# keyhole: Unbound forwards every query to keyhole (ADR 0004), which relays
# it to the ISP resolver. Installed as
# /usr/local/etc/unbound.opnsense.d/keyhole.conf; OPNsense copies it into
# Unbound's chroot on reconfigure.
server:
  do-not-query-localhost: no

forward-zone:
  name: "."
  forward-addr: 127.0.0.1@5353
