[start]
command:/usr/local/etc/rc.d/keyhole start
parameters:
type:script
message:Starting keyhole

[stop]
command:/usr/local/etc/rc.d/keyhole stop
parameters:
type:script
message:Stopping keyhole

[restart]
command:/usr/local/etc/rc.d/keyhole restart
parameters:
type:script
message:Restarting keyhole

[status]
command:/usr/local/etc/rc.d/keyhole status
parameters:
type:script_output
errors:no
message:Requesting keyhole status
