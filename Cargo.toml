[package]
name = "keyhole"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Detects Korean ISP censorship on an OPNsense router and bypasses it only where needed"
license = "MIT"
publish = false

[profile.release]
lto = true
codegen-units = 1
strip = true

[target.'cfg(target_os = "freebsd")'.dependencies]
libc = "0.2.191"
